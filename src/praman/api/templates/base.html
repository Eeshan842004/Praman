<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Praman{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <style>
    /* ── Design system ────────────────────────────────────────────────────
       Dark-first, because this is an evidence and monitoring surface that
       stays open. Depth comes from stepping surface lightness ~4% per layer,
       not from shadows — on a dark ground a lighter surface reads as closer
       and a shadow reads as nothing.

       ONE series palette, defined once and reused on every page, so a tier
       keeps its colour wherever it appears. Semantic ok/bad are separate from
       the brand accent so "good" never competes with "interactive".        */
    :root {
      --bg:        #0A0E14;   /* true grey-blue, not #000 */
      --surface:   #10161F;
      --surface-2: #161E29;
      --surface-3: #1C2634;
      --line:      #202A38;
      --line-2:    #2B3849;

      --text:      #E4E9F0;   /* off-white; pure white glares on dark */
      --text-2:    #93A1B5;
      --text-3:    #5D6B7F;

      --brass:     #E2B857;   /* brand: the seal. eyebrows, links, marks */
      --brass-dim: #8A7038;

      --ok:        #34D399;
      --bad:       #F87171;
      --warn:      #FBBF24;

      --t0: #64748B;  /* terminate — neutral, nothing happened */
      --t1: #60A5FA;  /* silent retry */
      --t2: #A78BFA;  /* rail switch */
      --t3: #FBBF24;  /* customer nudge */
      --t4: #34D399;  /* human escalate — the good terminal state */
    }

    * { box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Archivo, ui-sans-serif, system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      /* A single very soft brass wash at the top. One flourish, no gradient
         hero — restraint is the whole visual argument here. */
      background-image:
        radial-gradient(900px 380px at 50% -160px, rgba(226,184,87,.055), transparent 70%);
      background-repeat: no-repeat;
    }

    .mono, .num { font-family: "JetBrains Mono", ui-monospace, monospace;
                  font-variant-numeric: tabular-nums; }

    /* ── surfaces ─────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .card-2 { background: var(--surface-2); }

    /* ── eyebrow ──────────────────────────────────────────────────────── */
    .eyebrow {
      font-family: "JetBrains Mono", monospace;
      font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase;
      color: var(--brass); font-weight: 500;
    }
    .label {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
      color: var(--text-3);
    }

    /* ── nav ──────────────────────────────────────────────────────────── */
    .navlink {
      padding: 7px 14px; border-radius: 8px; font-size: 13.5px;
      color: var(--text-2); border: 1px solid transparent;
      transition: color .18s ease, background .18s ease, border-color .18s ease;
    }
    .navlink:hover { color: var(--text); background: var(--surface-2); }
    .navlink[aria-current="page"] {
      color: var(--text); background: var(--surface-2);
      border-color: var(--line-2);
    }

    /* ── buttons ──────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 13px; border-radius: 8px;
      font-size: 12.5px; font-weight: 500; letter-spacing: .01em;
      border: 1px solid var(--line-2); background: var(--surface-2);
      color: var(--text-2); cursor: pointer;
      transition: transform .12s ease, border-color .18s ease,
                  color .18s ease, background .18s ease;
    }
    .btn:hover {
      color: var(--text); background: var(--surface-3);
      border-color: var(--brass-dim); transform: translateY(-1px);
    }
    .btn:active { transform: translateY(0); }
    .btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
    .btn-ghost { background: transparent; border-color: transparent; }
    .btn-ghost:hover { background: var(--surface-2); border-color: var(--line-2); }

    /* ── pills ────────────────────────────────────────────────────────── */
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 10px; border-radius: 999px;
      font-family: "JetBrains Mono", monospace;
      font-size: 10.5px; font-weight: 600; letter-spacing: .08em;
      text-transform: uppercase; white-space: nowrap;
      border: 1px solid transparent;
    }
    .pill-ok   { color: var(--ok);   background: rgba(52,211,153,.10); border-color: rgba(52,211,153,.28); }
    .pill-bad  { color: var(--bad);  background: rgba(248,113,113,.10); border-color: rgba(248,113,113,.28); }
    .pill-warn { color: var(--warn); background: rgba(251,191,36,.10);  border-color: rgba(251,191,36,.28); }
    .pill-mute { color: var(--text-2); background: var(--surface-2); border-color: var(--line-2); }
    .dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; }

    /* ── tables ───────────────────────────────────────────────────────── */
    table { border-collapse: collapse; width: 100%; }
    th {
      text-align: left; font-family: "JetBrains Mono", monospace;
      font-size: 10px; letter-spacing: .13em; text-transform: uppercase;
      color: var(--text-3); font-weight: 500;
      padding: 0 14px 10px 0; border-bottom: 1px solid var(--line);
    }
    td { padding: 11px 14px 11px 0; border-bottom: 1px solid var(--line);
         font-size: 13.5px; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    .row-link { transition: background .15s ease; }
    .row-link:hover { background: var(--surface-2); }
    .tnum { text-align: right; padding-right: 18px;
            font-family: "JetBrains Mono", monospace;
            font-variant-numeric: tabular-nums; }

    code {
      font-family: "JetBrains Mono", monospace; font-size: .87em;
      background: var(--surface-2); border: 1px solid var(--line);
      padding: 2px 6px; border-radius: 5px; color: var(--text-2);
    }

    /* ── motion: state changes only, and never for its own sake ───────── */
    @keyframes rise { from { opacity: 0; transform: translateY(8px); }
                      to   { opacity: 1; transform: none; } }
    .rise { animation: rise .5s cubic-bezier(.22,.61,.36,1) both; }

    /* Bars grow from zero once, on load. The width is set inline as a CSS
       variable so the animation lands on the real value. */
    @keyframes grow { from { width: 0; } to { width: var(--w); } }
    .bar { animation: grow .85s cubic-bezier(.22,.61,.36,1) both; width: var(--w); }

    @media (prefers-reduced-motion: reduce) {
      .rise, .bar { animation: none !important; }
      .btn:hover { transform: none; }
    }

    a { color: var(--brass); text-decoration: none; }
    a:hover { color: #F0CF80; }
    ::selection { background: rgba(226,184,87,.25); }
  </style>
</head>
<body class="min-h-full">

<header class="border-b" style="border-color: var(--line)">
  <div class="max-w-6xl mx-auto px-6 h-16 flex items-center gap-8">
    <a href="/" class="flex items-center gap-2.5 shrink-0">
      <span class="grid place-items-center w-7 h-7 rounded-md text-[13px] font-bold"
            style="background: rgba(226,184,87,.12); color: var(--brass); border: 1px solid rgba(226,184,87,.25)">प</span>
      <span class="text-[17px] font-semibold tracking-tight" style="color: var(--text)">Praman</span>
    </a>
    <nav class="flex gap-1">
      <a href="/" class="navlink" {% if page == 'batch' %}aria-current="page"{% endif %}>Batch</a>
      <a href="/attestation" class="navlink" {% if page == 'attestation' %}aria-current="page"{% endif %}>Attestation</a>
    </nav>
    <span class="ml-auto hidden lg:block text-[12px]" style="color: var(--text-3)">
      the model proposes &middot; the policy disposes &middot; the ledger remembers
    </span>
  </div>
</header>

<main class="max-w-6xl mx-auto px-6 py-10">
  {% block content %}{% endblock %}
</main>

<footer class="max-w-6xl mx-auto px-6 pb-14 pt-8 mt-8 border-t text-[12px]"
        style="border-color: var(--line); color: var(--text-3)">
  Every number on this page is read from the same append-only ledger
  <code>praman verify</code> attests. There is no separate analytics store, so nothing
  here can drift from the evidence.
</footer>

</body>
</html>
